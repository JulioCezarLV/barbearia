<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Contato - Barbearia do Navalha</title>

		<link rel="stylesheet" href="reset.css">
		<link rel="stylesheet" href="style4.css">
		<link rel="shortcut icon" type='image/ico' href="imagens\favicon.ico">
	</head>
	<body>
		<header> <!-- cabeçalho -->
			<div class="caixa">
				<img src="imagens\logo-navalha.png">
				
				<nav>
					<ul>
						<li><a href="index3.html">Home</a></li>
						<li><a href='produtos.html'>Produtos</a></li>
						<li><a href="contato.html">Contato</a></li>
					</ul>
				</nav>
			</div>	
		</header>

		<main>
			<form>
				<label for="nomesobrenome">Nome e Sobrenome</label>
				<input type="text" id="nomesobrenome" class="input-padrao" >
				
				<label for="email">Email</label>
				<input type="text" id="email" class="input-padrao">
				
				<label for="telefone">Telefone</label>
				<input type="text" id="telefone" class="input-padrao">

				<label for="mensagem">Mensagem</label>
				<textarea cols="30" rows="10" id="mensagem" class="input-padrao"></textarea>
				
				<div>
					<p>Como prefere o nosso contato?</p>
					<label for="radio-email"><input type="radio" name="contato" value="email" id="radio-email">Email</label> <!-- name é a propriedade que associa os radio buttons para não deixar marcar mais do que um -->

					<label for="radio-telefone"><input type="radio" name="contato" value="telefone" id="radio-telefone">Telefone</label>

					<label for="radio-whatsapp"><input type="radio" name="contato" value="whatsapp" id="radio-whatsapp">WhatsApp</label>
				</div>	

				<label class="checkbox"><input type="checkbox">Gostaria de receber nossas novidades por email?</label>

				<input type="submit" value="Enviar Formulário" class="enviar">
			
			</form>
		</main>

		<footer> <!-- rodapé -->
			<img src="imagens\logo-branco.png">
			<p class="copyright">&copy; Copyright Barbearia do Navalha - 2026</p>	
		</footer>
	</body>
</html>
